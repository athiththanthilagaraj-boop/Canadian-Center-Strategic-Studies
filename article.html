  /* Styles specific to the article template only */
  .article-wrap { max-width: 760px; margin: 0 auto; padding: 64px var(--gutter) 100px; }
  .article-back { font-family: var(--font-mono); font-size: 12.5px; color: var(--brass); display: inline-flex; align-items: center; gap: 8px; margin-bottom: 40px; }

  .article-body p { font-size: 17px; line-height: 1.8; color: var(--ink); margin: 0 0 24px; }
  .article-bio { margin-top: 56px; padding-top: 28px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-soft); }
  .article-bio strong { color: var(--ink); font-family: var(--font-display); font-size: 16px; display: block; margin-bottom: 6px; }
  .article-source { margin-top: 20px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); }
  .article-source a { color: var(--brass); }
